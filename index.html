<style>
:root{--bg:#0d1526;--sf:#16213a;--sf2:#1c2a47;--bd:#26365a;--tx:#e8eefc;--mu:#8fa0c4;--ac:#0fb98f;--ac2:#0a8f70;--rd:#ef5350;--yl:#f5a524;--bl:#4c8dff}
